<!doctype html>
<!-- 记忆核心 · 独立 Web UI 入口（由 dsh-memory serve 提供）。
     同一套 React UI（src/client MemoryLibrary）在 DSH 内嵌与浏览器/iframe 两处挂载。
     主题：DSH 的 --dsw-alias-* 设计变量在独立页无宿主注入，此处按浅色定义
     并适配 prefers-color-scheme 暗色，保持与 DSH 视觉一致。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>记忆核心 · Memory Eternal</title>
<style>
  /* 与 DSH 主界面共用同一套设计 token（浅色取自官方 design_platform_css_default）。
     独立页无宿主注入，故在此复刻；iframe 内嵌与浏览器直开视觉一致。 */
  :root {
    --dsw-alias-label-primary: #0f0f0f;
    --dsw-alias-label-primary-inverted: #ffffff;
    --dsw-alias-label-secondary: #545557;
    --dsw-alias-label-tertiary: #7f8287;
    --dsw-alias-bg-base: #ffffff;
    --dsw-alias-bg-layer-1: #ffffff;
    --dsw-alias-bg-layer-2: #fafafa;
    --dsw-alias-bg-layer-3: #f5f5f5;
    --dsw-alias-bg-overlay: rgba(0, 0, 0, 0.45);
    --dsw-alias-interactive-bg-hover: #2631480f;
    --dsw-alias-border-l1: rgba(0, 0, 0, 0.04);
    --dsw-alias-border-l2: rgba(0, 0, 0, 0.10);
    --dsw-alias-border-l3: rgba(0, 0, 0, 0.12);
    --dsw-alias-border-l4: rgba(0, 0, 0, 0.16);
    --dsw-alias-state-business-primary: #4176e6;
    --dsw-alias-state-business-tertiary: #e4edfd;
    --dsw-alias-state-success-primary: #22c55e;
    --dsw-alias-state-success-tertiary: #e6faed;
    --dsw-alias-state-warn-primary: #f59e0b;
    --dsw-alias-state-warn-label: #dd8629;
    --dsw-alias-state-warn-tertiary: #fef5e7;
    --dsw-alias-state-error-primary: #dc2626;
    --dsw-alias-state-error-tertiary: #fee2e2;
    --dsw-alias-brand-primary: #4176e6;
    --dsw-alias-accent: #4176e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --dsw-alias-label-primary: #ebeef2;
      --dsw-alias-label-primary-inverted: #0f1115;
      --dsw-alias-label-secondary: #979da6;
      --dsw-alias-label-tertiary: #7f8287;
      --dsw-alias-bg-base: #0f1115;
      --dsw-alias-bg-layer-1: #212123;
      --dsw-alias-bg-layer-2: #292929;
      --dsw-alias-bg-layer-3: #3c3c3d;
      --dsw-alias-bg-overlay: rgba(0, 0, 0, 0.6);
      --dsw-alias-interactive-bg-hover: #ffffff14;
      --dsw-alias-border-l1: rgba(255, 255, 255, 0.06);
      --dsw-alias-border-l2: rgba(255, 255, 255, 0.12);
      --dsw-alias-border-l3: rgba(255, 255, 255, 0.16);
      --dsw-alias-border-l4: rgba(255, 255, 255, 0.20);
      --dsw-alias-state-business-primary: #7aaaff;
      --dsw-alias-state-business-tertiary: #34415b;
      --dsw-alias-state-success-primary: #22c55e;
      --dsw-alias-state-success-tertiary: #233c2c;
      --dsw-alias-state-warn-primary: #f59e0b;
      --dsw-alias-state-warn-label: #f7ad31;
      --dsw-alias-state-warn-tertiary: #27241f;
      --dsw-alias-state-error-primary: #f87171;
      --dsw-alias-state-error-tertiary: #3b1d1d;
      --dsw-alias-brand-primary: #7aaaff;
      --dsw-alias-accent: #7aaaff;
    }
  }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--dsw-alias-bg-base); color: var(--dsw-alias-label-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  #root { height: 100vh; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="app.js"></script>
</body>
</html>
